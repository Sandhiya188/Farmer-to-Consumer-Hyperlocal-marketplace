{% extends 'base.html' %}

{% block title %}Delete Harvest - FarmConnect{% endblock %}

{% block content %}
<div class="form-card delete-card">
  <div class="delete-icon">⚠️</div>
  <h2>Remove Harvest Listing</h2>
  <p class="text-muted delete-message">
    Are you sure you want to remove <strong>{{ product.name }}</strong> from your store? This action cannot be undone.
  </p>

  <form method="POST" class="delete-actions-row">
    {% csrf_token %}
    <a href="{% url 'farmer_dashboard' %}" class="btn btn-outline">Cancel</a>
    <button type="submit" class="btn btn-danger">Yes, Delete Listing</button>
  </form>
</div>
{% endblock %}
